<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pickle Time Admin</title>
<style>body{font:15px Inter,system-ui,sans-serif;margin:0;background:#f6f3ec;color:#14213d}main{max-width:760px;margin:0 auto;padding:24px 16px}
h1{font-size:1.4rem}input,button,select{font:inherit;padding:10px 12px;border:1.5px solid #d9dde5;border-radius:10px}
button{background:#ffb800;border-color:#e5a400;font-weight:700;cursor:pointer}button.x{background:#fff;border-color:#e0493f;color:#e0493f}
.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 6px 24px #0c1f3f1f}.row{display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 6px;border-bottom:1px solid #d9dde5}#msg{color:#e0493f;min-height:1.2em}
.blocked{background:#f1f2f5;color:#6b7589}small{color:#6b7589}</style></head><body><main>
<h1>Pickle Time admin</h1>
<div class="card" id="login"><div class="row"><input id="pw" type="password" placeholder="GitHub access token" style="flex:1"><button id="go">Sign in</button></div>
<small>Fine-grained token for this repo only, with <b>Contents: Read and write</b>. It stays in this browser tab only (cleared when you close it).</small></div>
<p id="msg" role="status"></p>
<div id="panel" hidden>
 <div class="card"><b>Block an hour</b> (maintenance, tournament)<div class="row" style="margin-top:10px"><input type="date" id="bd"><select id="bh"></select><button id="block">Block hour</button></div></div>
 <div class="card"><b>Upcoming bookings</b><table><thead><tr><th>Date</th><th>Time</th><th>Name</th><th>Phone</th><th>Ref</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script>
const $=id=>document.getElementById(id);let key=sessionStorage.getItem('k')||'';
const _h=location.hostname.split('.'),_p=location.pathname.split('/').filter(Boolean);
const OWNER=_h[0],REPO=(_h[1]==='github'&&_p[0]&&!_p[0].endsWith('.html'))?_p[0]:OWNER+'.github.io';
const API=`https://api.github.com/repos/${OWNER}/${REPO}`,FILE='data/bookings.json';
const t=h=>`${(h+11)%12+1}${h<12?'AM':'PM'}`;
for(let h=6;h<22;h++)$('bh').add(new Option(t(h)+'–'+t(h+1),h));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gh=(p,o={})=>fetch(API+p,{...o,headers:{Authorization:'Bearer '+key,Accept:'application/vnd.github+json','Content-Type':'application/json'},cache:'no-store'});
const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Manila'}).format(new Date());
async function read(){const r=await gh(`/contents/${FILE}?ref=main&_=${Date.now()}`);if(r.status===401||r.status===403)throw new Error('Token not accepted');if(!r.ok)throw new Error('Cannot read bookings ('+r.status+')');
 const j=await r.json();return{sha:j.sha,data:JSON.parse(atob(j.content.replace(/\n/g,'')))}}
async function change(fn){for(let i=0;i<4;i++){const{sha,data}=await read();const err=fn(data);if(err)throw new Error(err);
 const r=await gh(`/contents/${FILE}`,{method:'PUT',body:JSON.stringify({message:'admin update',branch:'main',sha,content:btoa(JSON.stringify(data,null,1))})});
 if(r.ok)return;if(r.status!==409&&r.status!==422)throw new Error('Save failed ('+r.status+')')}throw new Error('Conflict, try again')}
async function who(n){try{const j=await(await gh('/issues/'+n)).json();const m=/```json\s*([\s\S]*?)```/.exec(j.body||'');const d=JSON.parse(m[1]);return d}catch{return{}}}
async function load(){try{const{data}=await read();$('login').hidden=true;$('panel').hidden=false;$('msg').textContent='';
 const ks=Object.keys(data).filter(k=>k.split('/')[0]>=today).sort((a,b)=>a.split('/')[0].localeCompare(b.split('/')[0])||a.split('/')[1]-b.split('/')[1]);
 const info={};await Promise.all([...new Set(ks.map(k=>data[k].issue).filter(Boolean))].map(async n=>info[n]=await who(n)));
 $('rows').innerHTML=ks.length?ks.map(k=>{const[d,h]=k.split('/'),v=data[k],i=info[v.issue]||{};
  return `<tr class="${v.status}"><td>${d}</td><td>${t(+h)}</td><td>${esc(v.status==='blocked'?'Blocked':i.name)}</td><td>${esc(i.phone)}</td><td>${esc(v.ref||'-')}</td><td><button class="x" data-k="${k}">${v.status==='blocked'?'Unblock':'Cancel'}</button></td></tr>`}).join(''):'<tr><td colspan="6">No upcoming bookings.</td></tr>'}
 catch(e){$('msg').textContent=e.message;$('login').hidden=false;$('panel').hidden=true}}
$('go').onclick=()=>{key=$('pw').value.trim();sessionStorage.setItem('k',key);load()};
$('block').onclick=async()=>{try{const k=`${$('bd').value}/${$('bh').value}`;if(!$('bd').value)throw new Error('Pick a date');
 await change(d=>{if(d[k])return 'That hour is already booked';d[k]={status:'blocked'}});load()}catch(e){$('msg').textContent=e.message}};
$('rows').onclick=async e=>{const b=e.target.closest('button');if(!b||!confirm('Remove this hour? The slot becomes open again.'))return;
 try{await change(d=>{delete d[b.dataset.k]});load()}catch(e){$('msg').textContent=e.message}};
if(key)load();
</script></main></body></html>
